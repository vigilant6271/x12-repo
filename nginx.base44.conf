# Base44 dev server for the X12-Repo APT repository.
#
# Serves the repository tree in ./repo (the same layout the project publishes to
# GitHub Pages, and the layout `apt` expects: dists/<suite>/Release plus
# dists/<suite>/main/binary-<arch>/Packages). Directory listings are enabled so
# the preview shows the repository contents; files without an extension
# (Release, Packages) are served as plain text instead of being downloaded.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    charset utf-8;

    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;
    default_type text/plain;

    location / {
        try_files $uri $uri/ =404;
    }
}
